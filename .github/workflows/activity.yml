name: Update activity heatmap

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity-heatmap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The default GITHUB_TOKEN can only read this repository. Reading the
      # organization's private repositories needs a token stored as the
      # ORG_STATS_TOKEN secret (fine-grained PAT: all org repos, Contents: read).
      - name: Check ORG_STATS_TOKEN
        id: token
        env:
          ORG_STATS_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
        run: |
          if [ -z "$ORG_STATS_TOKEN" ]; then
            echo "::warning::ORG_STATS_TOKEN secret is not set; heatmap not updated."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build heatmap SVGs
        if: steps.token.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
          ORG: nexa-eng
          OUT_DIR: profile
        run: python3 scripts/build_activity.py

      - name: Commit and push if changed
        if: steps.token.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity-light.svg profile/activity-dark.svg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update activity heatmap"
          git push
